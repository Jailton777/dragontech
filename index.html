<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal DragonTech | Portal Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f7f6; margin: 0; overflow-x: hidden; }
        
        /* HEADER COM BOTÃO MENU */
        header { background: #0056b3; color: white; padding: 15px; display: flex; align-items: center; justify-content: center; position: relative; }
        .menu-icon { position: absolute; left: 20px; font-size: 24px; cursor: pointer; }
        
        /* MENU LATERAL (SIDEBAR) */
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.2); transition: 0.3s; z-index: 1000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar a, .sidebar h4 { padding: 15px 25px; text-decoration: none; color: #333; display: block; border-bottom: 1px solid #eee; }
        .sidebar a:hover { background: #f4f7f6; color: #0056b3; }
        .close-menu { position: absolute; top: 10px; right: 20px; font-size: 25px; cursor: pointer; color: #666; }

        /* LISTA DE PRODUTOS */
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .product-card { background: white; border-radius: 8px; margin-bottom: 20px; display: flex; padding: 15px; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); align-items: center; }
        .product-card img { width: 100px; height: 100px; object-fit: contain; }
        .btn-detalhes { background: #0056b3; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }

        /* PÁGINA DE DETALHES */
        #detalhes-page { display: none; background: white; padding: 20px; border-radius: 8px; }
        .full-img { width: 100%; max-height: 300px; object-fit: contain; }
        .price-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .price-table td { padding: 15px; border-bottom: 1px solid #eee; }
        .btn-buy { background: #28a745; color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; display: block; text-align: center; }
        .back-btn { background: #666; color: white; border: none; padding: 10px; margin-bottom: 20px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <span class="close-menu" onclick="toggleMenu()">&times;</span>
    <h4 style="background: #0056b3; color: white; margin: 0;">Categorias</h4>
    <a href="#" onclick="toggleMenu()">Celulares</a>
    <a href="#" onclick="toggleMenu()">Acessórios</a>
    <a href="#" onclick="toggleMenu()">Gamer</a>
    
    <h4>Filtros de Preço</h4>
    <a href="#" onclick="toggleMenu()">Até R$ 100,00</a>
    <a href="#" onclick="toggleMenu()">Até R$ 500,00</a>
    <a href="#" onclick="toggleMenu()">Acima de R$ 1.000,00</a>

    <h4>Suporte</h4>
    <a href="https://wa.me/SEUNUMERO" target="_blank">Ajuda via WhatsApp</a>
</div>

<header>
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
    <h1 style="margin:0;">Dragon<span>Tech</span></h1>
</header>

<div class="container">
    <div id="lista-produtos">
        <h2>Recomendações de Hoje</h2>
        
        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/61NfI-XP89L._AC_SX679_.jpg">
            <div style="flex:1;">
                <h3>Celular Gamer X1</h3>
                <p>A partir de: <b>R$ 1.299,00</b></p>
                <button class="btn-detalhes" onclick="abrirProduto('Celular Gamer X1', 'O melhor smartphone gamer de 2026 com tela 144Hz.', 'https://m.media-amazon.com/images/I/61NfI-XP89L._AC_SX679_.jpg', '1.299,00', '1.350,00')">Ver Detalhes</button>
            </div>
        </div>
    </div>

    <div id="detalhes-page">
        <button class="back-btn" onclick="voltar()">← Voltar</button>
        <img id="detalhe-img" src="" class="full-img">
        <h2 id="detalhe-titulo"></h2>
        <p id="detalhe-desc"></p>
        <table class="price-table">
            <tr>
                <td><b>Mercado Livre</b></td>
                <td><b style="color:green">R$ <span id="p-ml"></span></b></td>
                <td><a href="#" class="btn-buy">LOJA 1</a></td>
            </tr>
            <tr>
                <td><b>Shopee</b></td>
                <td><b style="color:green">R$ <span id="p-sh"></span></b></td>
                <td><a href="#" class="btn-buy">LOJA 2</a></td>
            </tr>
        </table>
    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function abrirProduto(nome, desc, img, precoML, precoSH) {
        document.getElementById('lista-produtos').style.display = 'none';
        document.getElementById('detalhes-page').style.display = 'block';
        document.getElementById('detalhe-titulo').innerText = nome;
        document.getElementById('detalhe-desc').innerText = desc;
        document.getElementById('detalhe-img').src = img;
        document.getElementById('p-ml').innerText = precoML;
        document.getElementById('p-sh').innerText = precoSH;
        window.scrollTo(0,0);
    }

    function voltar() {
        document.getElementById('lista-produtos').style.display = 'block';
        document.getElementById('detalhes-page').style.display = 'none';
    }
</script>

</body>
</html>
